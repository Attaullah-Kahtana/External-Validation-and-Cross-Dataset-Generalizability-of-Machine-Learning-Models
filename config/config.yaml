seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"

datasets:
  A:
    raw_file: "dataset_a_cvd.csv"
    processed_file: "dataset_a_processed.csv"
    source_type: "clinical"

  B:
    raw_file: "dataset_b_brfss.csv"
    processed_file: "dataset_b_processed.csv"
    source_type: "self_reported"

split:
  train: 0.80
  validation: 0.10
  test: 0.10

target_column: "cvd"

features:
  - age
  - gender
  - smoking
  - bmi
  - alcohol
  - physical_activity
  - high_bp
  - high_chol
  - high_gluc

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95

grid_search:
  cv: 3
  scoring: "roc_auc"
  n_jobs: -1

top_k_calibration: 3